# Any input ends the screensaver. Pointer motion is handled in scripts/aerial.lua
# so that it can ignore the spurious motion a new window receives.
UNMAPPED    script-binding aerial/dismiss
ANY_UNICODE script-binding aerial/dismiss
MBTN_LEFT   script-binding aerial/dismiss
MBTN_RIGHT  script-binding aerial/dismiss
MBTN_MID    script-binding aerial/dismiss
WHEEL_UP    script-binding aerial/dismiss
WHEEL_DOWN  script-binding aerial/dismiss
# Built-in bindings are off, so closing the window has to be bound explicitly.
CLOSE_WIN   quit
