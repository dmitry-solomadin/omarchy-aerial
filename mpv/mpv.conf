# Isolated mpv profile for the screensaver. bin/aerial points --config-dir here,
# so ~/.config/mpv is never read and the user's own mpv never reads this.

vo=gpu-next
hwdec=auto-safe
audio=no

# Apple's clips are 240 fps with dyadic temporal layers. Dropping the top layer
# gives a clean 120 fps, which is all a 144 Hz panel can use, at half the decode.
vd-lavc-skipframe=nonref

# Window. The app id is passed on the command line, where pkill can match it.
fullscreen=yes
force-window=immediate
cursor-autohide=always
idle=yes
title=Aerial

# Fill the screen on any aspect ratio, as Apple does, rather than letterboxing.
panscan=1.0

# mpv would otherwise inhibit idle, which would hold off the Omarchy lock timer.
stop-screensaver=no

# Nothing on screen but ours.
osc=no
osd-level=0
osd-bar=no
input-default-bindings=no
input-terminal=no
terminal=no
load-stats-overlay=no
load-console=no
load-select=no
load-positioning=no
load-commands=no
load-auto-profiles=no
ytdl=no

# Files are local, so read ahead modestly and open the next clip in advance.
cache=no
demuxer-max-bytes=64MiB
prefetch-playlist=yes
loop-playlist=inf

# Dip-to-black transitions, driven by scripts/aerial.lua. Contrast is a gain on
# the picture, so -100 is pure black, and changing it costs no renderer reset.
contrast=-100
